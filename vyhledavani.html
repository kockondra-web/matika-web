  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1B2A4A; --soft:#3A4A6B; --paper:#FAF9F6; --gold:#D4A24E; --line:rgba(27,42,74,.12); }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:Inter,sans-serif; }
    header { border-bottom:1px solid var(--line); padding:24px 0; } .wrap { width:min(850px, calc(100% - 48px)); margin:auto; }
    .logo { color:var(--ink); font:600 20px Fraunces,serif; text-decoration:none; } .logo span { color:var(--gold); }
    main { padding:72px 0; } h1 { margin:0 0 12px; font:600 clamp(38px,6vw,58px)/1.05 Fraunces,serif; letter-spacing:-.03em; }
    p { color:var(--soft); line-height:1.6; } input { width:100%; margin:26px 0 18px; padding:15px 17px; border:1px solid var(--line); border-radius:6px; font:16px Inter,sans-serif; color:var(--ink); }
    input:focus { outline:2px solid var(--gold); outline-offset:2px; } #summary { font-size:14px; } ul { list-style:none; margin:24px 0 0; padding:0; display:grid; gap:10px; }
    a.result { display:block; padding:18px 20px; background:#fff; border:1px solid var(--line); border-radius:5px; color:var(--ink); font-weight:700; text-decoration:none; } a.result:hover { border-color:var(--gold); } .meta { margin-top:5px; color:var(--soft); font-size:14px; font-weight:400; }
  </style>
</head>
<body data-no-study-tools="true">
  <header><div class="wrap"><a class="logo" href="index.html">matematika<span>.</span>jasně</a></div></header>
  <main class="wrap">
    <h1>Najdi své téma</h1>
    <p>Hledej napříč učivem základní i střední školy.</p>
    <label for="search">Téma matematiky</label>
    <input id="search" type="search" placeholder="Např. zlomky, goniometrie nebo rovnice" autocomplete="off" autofocus>
    <p id="summary" aria-live="polite"></p>
    <ul id="results"></ul>
  </main>
  <script src="site.js?v=9"></script>
  <script>
    const input = document.getElementById('search'); const results = document.getElementById('results'); const summary = document.getElementById('summary');
    const initial = new URLSearchParams(location.search).get('q') || '';
    function draw() { const q = input.value.trim(); const found = q ? mathJasneSearch(q) : []; summary.textContent = q ? (found.length ? `Nalezeno témat: ${found.length}` : 'Žádné téma přesně neodpovídá. Zkus kratší nebo obecnější výraz.') : 'Začni psát název tématu.'; results.innerHTML = found.map(item => `<li><a class="result" href="${item.path}">${item.title}<div class="meta">Otevřít lekci →</div></a></li>`).join(''); }
    input.value = initial; input.addEventListener('input', draw); draw();
  </script>
</body>
